<!DOCTYPE html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" />
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(circle at 14% 12%, rgba(59,130,246,.28), transparent 45%),
      radial-gradient(circle at 88% 90%, rgba(124,58,237,.30), transparent 48%),
      linear-gradient(160deg,#050816,#0b1020);
    color:#fff;font-family:"Inter",system-ui,sans-serif;
    display:flex;flex-direction:column;justify-content:center;padding:0 86px;box-sizing:border-box}
  .eyebrow{font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:#60a5fa;font-weight:600;margin:0 0 26px}
  h1{font-family:"Space Grotesk",sans-serif;font-size:78px;line-height:1.04;margin:0 0 20px;letter-spacing:-.02em}
  .sub{font-size:29px;color:#b4b7c3;margin:0 0 44px;max-width:22ch}
  .rule{height:4px;width:132px;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#7c3aed);margin-bottom:34px}
  .foot{display:flex;align-items:center;gap:20px;font-size:21px;color:#b4b7c3}
  .foot strong{color:#fff;font-weight:600}
  .dot{width:5px;height:5px;border-radius:50%;background:#4b5563}
  .brand{position:absolute;top:52px;right:86px;font-family:"Space Grotesk",sans-serif;
    font-size:20px;letter-spacing:.16em;color:#b4b7c3}
  .brand b{color:#fff}
</style></head>
<body>
  <div class="brand"><b>NEXOMA</b> BOOKS</div>
  <p class="eyebrow">Nexoma Labs LLC &middot; Publishing</p>
  <h1>Applied AI<br/>Engineering</h1>
  <div class="rule"></div>
  <p class="sub">From Prompt to Production</p>
  <div class="foot">
    <span><strong>Dr. Ahmed AlSalih</strong></span><span class="dot"></span>
    <span>Four standalone volumes</span><span class="dot"></span>
    <span>books.nexomalabs.com</span>
  </div>
</body></html>
